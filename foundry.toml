[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
bytecode_hash = "none"
ffi = false
fs_permissions = [{ access = "read", path = "./launch.json" }]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
fail_on_revert = true

[fmt]
line_length = 100

[lint]
lint_on_build = false
